version: 2
project_name: verkkokauppa-pp-cli
changelog:
  disable: true
builds:
  - id: verkkokauppa-pp-cli
    main: ./cmd/verkkokauppa-pp-cli
    binary: verkkokauppa-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X verkkokauppa-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: verkkokauppa-pp-mcp
    main: ./cmd/verkkokauppa-pp-mcp
    binary: verkkokauppa-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: verkkokauppa-pp-cli
    repository:
      owner: asadtariq96
      name: homebrew-tap
    homepage: "https://github.com/asadtariq96/verkkokauppa-pp-cli"
    description: "Search, filter, price, and availability data for Verkkokauppa.com, Finland's largest consumer-electronics retailer."
    install: |
      bin.install "verkkokauppa-pp-cli"
      bin.install "verkkokauppa-pp-mcp"
